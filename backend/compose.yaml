services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_storage}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_storage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud_storage} -d ${POSTGRES_DB:-cloud_storage}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
