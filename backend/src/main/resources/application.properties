spring.application.name=cloud-storage-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CLOUD_STORAGE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloud_storage}
spring.datasource.username=${DB_USER:cloud_storage}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:101MB}

app.storage.root=${STORAGE_ROOT:../storage}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:104857600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
