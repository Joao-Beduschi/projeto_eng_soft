spring.application.name=cloud-storage-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CLOUD_STORAGE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cloud_storage}
spring.datasource.username=${DB_USER:cloud_storage}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:101MB}

app.storage.root=${STORAGE_ROOT:../storage}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:104857600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

app.recovery.base-url=${APP_BASE_URL:http://localhost:8080}
app.recovery.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.recovery.min-interval-seconds=${PASSWORD_RESET_MIN_INTERVAL_SECONDS:60}
app.recovery.per-account-per-hour=${PASSWORD_RESET_PER_ACCOUNT_PER_HOUR:5}
app.recovery.global-per-minute=${PASSWORD_RESET_GLOBAL_PER_MINUTE:60}
app.recovery.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS:true}
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.profile.email-expiration-minutes=${EMAIL_CHANGE_EXPIRATION_MINUTES:30}
