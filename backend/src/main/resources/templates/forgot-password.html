<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{auth.forgot.title}"></title>
  <link rel="stylesheet" th:href="@{/assets/styles.css}">
  <script type="module" th:src="@{/assets/validation.js}"></script>
</head>
<body>
  <main class="auth-panel recovery-panel">
    <div class="auth-panel-inner">
      <nav class="language-switch" th:aria-label="#{language.label}">
        <a href="?lang=pt-BR" lang="pt-BR" hreflang="pt-BR"
           th:aria-current="${#locale.toLanguageTag() == 'pt-BR' ? 'true' : null}">Português (Brasil)</a>
        <a href="?lang=en" lang="en" hreflang="en"
           th:aria-current="${#locale.toLanguageTag() == 'en' ? 'true' : null}">English</a>
      </nav>
      <div class="auth-heading">
        <h2 th:text="#{auth.forgot.title}"></h2>
        <p th:text="#{auth.forgot.instructions}"></p>
      </div>
      <p th:if="${recoveryRequested}" role="status" th:text="#{auth.forgot.confirmation}"></p>
      <form class="auth-form" method="post" th:action="@{/forgot-password}">
        <p class="field-hint field-hint-error" role="alert" th:each="error : ${formErrors}" th:text="${error}"></p>
        <label class="field-label" for="recovery-email" th:text="#{auth.email}"></label>
        <input id="recovery-email" name="email" type="email" autocomplete="email" maxlength="320"
               th:value="${email}" th:placeholder="#{auth.email.placeholder}"
               th:data-validation-required="#{validation.email.required}"
               th:data-validation-type="#{validation.email.invalid}"
               th:data-validation-length="#{validation.email.length}" required>
        <button class="button button-primary button-wide" type="submit" th:text="#{auth.forgot.submit}"></button>
      </form>
      <a class="recovery-link" th:href="@{/login}" th:text="#{auth.reset.back}"></a>
    </div>
  </main>
</body>
</html>
