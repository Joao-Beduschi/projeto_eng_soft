<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title th:text="#{app.title}"></title>
  <link rel="stylesheet" th:href="@{/assets/styles.css}">
  <script th:if="${currentUser != null}" type="module" th:src="@{/assets/app.js}"></script>
  <script type="module" th:src="@{/assets/validation.js}"></script>
</head>
<body>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true">
    <div class="toast" th:if="${notice}" th:text="#{${notice}}"></div>
  </div>

  <main id="auth-view" class="auth-shell" th:if="${currentUser == null}">
    <section class="auth-story">
      <a class="brand brand-light" th:href="@{/}" th:aria-label="#{app.home}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <path d="M12.6 29.2h15.2a7.3 7.3 0 0 0 .5-14.6 9 9 0 0 0-17.2 1.6 6.6 6.6 0 0 0 1.5 13Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="m15.7 21.9 4.2-4.2 4.3 4.2M20 18v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Cloudspace</span>
      </a>
      <div class="story-copy">
        <p class="eyebrow" th:text="#{auth.story.eyebrow}"></p>
        <h1 th:text="#{auth.story.title}"></h1>
        <p th:text="#{auth.story.description}"></p>
      </div>
      <div class="story-orbit orbit-one"></div>
      <div class="story-orbit orbit-two"></div>
      <div class="story-card" aria-hidden="true">
        <div class="story-card-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 3.8h9l5 5v11.4H5V3.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 4v5h5M8.5 13h7M8.5 16.5h7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </div>
        <div><strong th:text="#{auth.story.card_title}"></strong><span th:text="#{auth.story.card_description}"></span></div>
        <span class="story-card-check">✓</span>
      </div>
      <div class="story-dots" aria-hidden="true"></div>
    </section>

    <section class="auth-panel">
      <div class="auth-panel-inner">
        <div class="auth-mobile-brand">
          <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none"><path d="M12.6 29.2h15.2a7.3 7.3 0 0 0 .5-14.6 9 9 0 0 0-17.2 1.6 6.6 6.6 0 0 0 1.5 13Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m15.7 21.9 4.2-4.2 4.3 4.2M20 18v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span>Cloudspace</span>
          </a>
        </div>
        <nav class="language-switch" th:fragment="languageSwitch" th:aria-label="#{language.label}">
          <a href="?lang=pt-BR" lang="pt-BR" hreflang="pt-BR"
             th:aria-current="${#locale.toLanguageTag() == 'pt-BR' ? 'true' : null}">Português (Brasil)</a>
          <a href="?lang=en" lang="en" hreflang="en"
             th:aria-current="${#locale.toLanguageTag() == 'en' ? 'true' : null}">English</a>
        </nav>
        <div class="auth-heading">
          <span class="eyebrow" id="auth-eyebrow" th:text="${registering} ? #{auth.register.eyebrow} : #{auth.login.eyebrow}"></span>
          <h2 id="auth-title" th:text="${registering} ? #{auth.register.title} : #{auth.login.title}"></h2>
          <p id="auth-description" th:text="${registering} ? #{auth.register.description} : #{auth.login.description}"></p>
        </div>
        <nav class="auth-tabs" th:aria-label="#{auth.access}">
          <a class="auth-tab" th:href="@{/login}" th:classappend="${!registering ? 'is-active' : ''}" th:text="#{auth.login.submit}"></a>
          <a class="auth-tab" th:href="@{/register}" th:classappend="${registering ? 'is-active' : ''}" th:text="#{auth.register.submit}"></a>
        </nav>
        <form id="auth-form" class="auth-form" method="post" th:action="${registering} ? @{/register} : @{/login}">
          <p class="field-hint field-hint-error" role="alert" th:each="error : ${formErrors}" th:text="${error}"></p>
          <label class="field-label" for="auth-email" th:text="#{auth.email}"></label>
          <input id="auth-email" name="email" type="email" autocomplete="email" th:value="${email}" maxlength="320"
                 th:data-validation-required="#{validation.email.required}"
                 th:data-validation-type="#{validation.email.invalid}"
                 th:data-validation-length="#{validation.email.length}" th:placeholder="#{auth.email.placeholder}" required>
          <label class="field-label" for="auth-password" th:text="#{auth.password}"></label>
          <input id="auth-password" name="password" type="password" th:autocomplete="${registering ? 'new-password' : 'current-password'}" th:attr="minlength=${registering ? 12 : null}" maxlength="128"
                 th:data-validation-required="#{validation.password.required}"
                 th:data-validation-length="${registering} ? #{validation.password.register_length} : #{validation.password.login_length}"
                 th:placeholder="#{auth.password.placeholder}" required>
          <p id="password-hint" class="field-hint" th:if="${registering}" th:text="#{auth.register.password_hint}"></p>
          <button id="auth-submit" class="button button-primary button-wide" type="submit" th:text="${registering} ? #{auth.register.submit} : #{auth.login.submit}"></button>
          <a class="recovery-link" th:unless="${registering}" th:href="@{/forgot-password}" th:text="#{auth.forgot.link}"></a>
          <p class="auth-privacy" th:text="#{auth.privacy}"></p>
        </form>
      </div>
      <footer class="auth-footer" th:text="#{auth.footer}"></footer>
    </section>
  </main>

  <div id="app-view" class="app-shell" th:if="${currentUser != null}"
       th:attr="data-folder-id=${currentFolder?.id},data-api-base=@{/api},data-login-url=@{/login}">
    <aside class="sidebar">
      <a class="brand sidebar-brand" th:href="@{/}" th:aria-label="#{app.home}">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><path d="M12.6 29.2h15.2a7.3 7.3 0 0 0 .5-14.6 9 9 0 0 0-17.2 1.6 6.6 6.6 0 0 0 1.5 13Z" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="m15.7 21.9 4.2-4.2 4.3 4.2M20 18v9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>Cloudspace</span>
      </a>

      <a id="nav-my-files" class="side-link is-selected" th:href="@{/files}">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.8 6.5A1.7 1.7 0 0 1 5.5 4.8h4l1.8 1.8h7.2a1.7 1.7 0 0 1 1.7 1.7v9.9a1.7 1.7 0 0 1-1.7 1.7H5.5a1.7 1.7 0 0 1-1.7-1.7V6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span th:text="#{files.title}"></span>
      </a>

      <div class="sidebar-section-label" th:text="#{workspace.section}"></div>
      <div class="sidebar-note">
        <span class="sidebar-note-icon">✦</span>
        <div><strong th:text="#{workspace.private_title}"></strong><span th:text="#{workspace.private_note}"></span></div>
      </div>

      <div class="sidebar-bottom">
        <div class="sidebar-storage">
          <div class="storage-icon">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.2A2.2 2.2 0 0 1 6.2 5h11.6A2.2 2.2 0 0 1 20 7.2v9.6a2.2 2.2 0 0 1-2.2 2.2H6.2A2.2 2.2 0 0 1 4 16.8V7.2Z" stroke="currentColor" stroke-width="1.7"/><path d="M4 9h16M16 14.5h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </div>
          <div><strong th:text="#{workspace.local_storage}"></strong><span th:text="#{workspace.managed}"></span></div>
        </div>
        <div class="account-row">
          <span id="user-avatar" class="avatar" th:text="${#strings.toUpperCase(#strings.substring(currentUser.email, 0, 1))}">U</span>
          <span id="user-email" class="account-email" th:text="${currentUser.email}"></span>
          <form method="post" th:action="@{/logout}">
            <button id="logout-button" class="icon-button logout-button" type="submit" th:title="#{auth.logout}" th:aria-label="#{auth.logout}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M15.5 16l4-4-4-4M19 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          </form>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <nav class="breadcrumbs" id="breadcrumbs" th:aria-label="#{workspace.location}">
          <a class="breadcrumb-button" th:href="@{/files}" th:classappend="${currentFolder == null ? 'is-current' : ''}" th:text="#{files.title}"></a>
          <th:block th:each="part, position : ${breadcrumbs}">
            <span class="breadcrumb-separator" aria-hidden="true">/</span>
            <a class="breadcrumb-button" th:href="@{/folders/{id}(id=${part.id})}" th:text="${part.name}"
               th:classappend="${position.last ? 'is-current' : ''}"></a>
          </th:block>
        </nav>
        <div class="topbar-right">
          <nav th:replace="~{::languageSwitch}"></nav>
          <span class="secure-label"><span class="secure-dot"></span><span th:text="#{workspace.secure}"></span></span>
          <form method="post" th:action="@{/logout}">
            <button id="mobile-logout" class="icon-button mobile-logout" type="submit" th:aria-label="#{auth.logout}" th:title="#{auth.logout}">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M15.5 16l4-4-4-4M19 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          </form>
        </div>
      </header>

      <div id="drop-area" class="workspace-content">
        <section class="page-heading">
          <div>
            <p class="eyebrow" id="page-eyebrow" th:text="${currentFolder == null} ? #{workspace.root_eyebrow} : #{workspace.folder_eyebrow}"></p>
            <h1 id="page-title" th:text="${currentFolder != null} ? ${currentFolder.name} : #{files.title}"></h1>
            <p id="page-description" th:text="${currentFolder == null} ? #{workspace.root_description} : #{workspace.folder_description}"></p>
          </div>
          <div class="page-actions">
            <button id="new-folder-button" class="button button-secondary" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.8 7A1.8 1.8 0 0 1 5.6 5.2h4l1.8 1.8h7A1.8 1.8 0 0 1 20.2 8.8v8.6a1.8 1.8 0 0 1-1.8 1.8H5.6a1.8 1.8 0 0 1-1.8-1.8V7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v5M9.5 12.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <span th:text="#{folders.new}"></span>
            </button>
            <button id="upload-button" class="button button-primary" type="button">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15.5V4.8m0 0L8.3 8.5M12 4.8l3.7 3.7M5 14.5v3.7A1.8 1.8 0 0 0 6.8 20h10.4a1.8 1.8 0 0 0 1.8-1.8v-3.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span th:text="#{files.upload}"></span>
            </button>
            <input id="file-input" type="file" multiple hidden>
          </div>
        </section>

        <section class="stats-grid" th:aria-label="#{workspace.overview}">
          <article class="stat-card">
            <span class="stat-icon stat-icon-blue">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.8 6.5A1.7 1.7 0 0 1 5.5 4.8h4l1.8 1.8h7.2a1.7 1.7 0 0 1 1.7 1.7v9.9a1.7 1.7 0 0 1-1.7 1.7H5.5a1.7 1.7 0 0 1-1.7-1.7V6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </span>
            <span class="stat-label" th:text="#{workspace.folder_count}"></span>
            <strong id="folder-count" class="stat-value" th:text="${#numbers.formatInteger(folders.size(), 1, 'DEFAULT')}">0</strong>
          </article>
          <article class="stat-card">
            <span class="stat-icon stat-icon-violet">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 3.8h8l4 4v12.4H6V3.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 4v4h4M9 12h6M9 15.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <span class="stat-label" th:text="#{workspace.file_count}"></span>
            <strong id="file-count" class="stat-value" th:text="${#numbers.formatInteger(files.size(), 1, 'DEFAULT')}">0</strong>
          </article>
          <article class="stat-card stat-card-wide">
            <span class="stat-icon stat-icon-green">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.8v16.4M3.8 12h16.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </span>
            <span class="stat-label" th:text="#{workspace.upload_limit}"></span>
            <strong class="stat-value">100 MB <small th:text="#{workspace.per_file}"></small></strong>
          </article>
        </section>

        <section class="file-browser">
          <div class="browser-toolbar">
            <div class="browser-title">
              <h2 th:text="#{workspace.contents}"></h2>
              <span id="contents-count" class="count-pill" th:text="${itemCount == 1} ? #{workspace.item.count(${#numbers.formatInteger(itemCount, 1, 'DEFAULT')})} : #{workspace.items.count(${#numbers.formatInteger(itemCount, 1, 'DEFAULT')})}"></span>
            </div>
            <label class="search-box">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
              <input id="search-input" type="search" th:aria-label="#{workspace.search}" th:placeholder="#{workspace.search}" autocomplete="off">
              <span class="search-shortcut">⌘ K</span>
            </label>
          </div>

          <section id="folders-section" class="folders-section" th:hidden="${folders.isEmpty()}">
            <div class="section-heading">
              <h3 th:text="#{folders.heading}"></h3>
              <span id="folders-section-count" class="section-count" th:text="${#numbers.formatInteger(folders.size(), 1, 'DEFAULT')}"></span>
            </div>
            <div id="folder-grid" class="folder-grid">
              <article class="folder-card" th:each="folder : ${folders}" th:attr="data-item-id=${folder.id},data-item-name=${folder.name}">
                <a class="folder-open" th:href="@{/folders/{id}(id=${folder.id})}" th:aria-label="#{folders.open_named(${folder.name})}">
                  <span class="folder-symbol" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M3.8 6.5A1.7 1.7 0 0 1 5.5 4.8h4l1.8 1.8h7.2a1.7 1.7 0 0 1 1.7 1.7v9.9a1.7 1.7 0 0 1-1.7 1.7H5.5a1.7 1.7 0 0 1-1.7-1.7V6.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
                  </span>
                  <span class="folder-copy"><strong th:text="${folder.name}"></strong><span th:text="#{folders.open}"></span></span>
                </a>
                <div class="folder-actions">
                  <button class="tiny-action" type="button" data-folder-action="rename" th:aria-label="#{button.rename_named(${folder.name})}" th:title="#{button.rename}">
                    <svg viewBox="0 0 24 24" fill="none"><path d="m14.2 5.2 4.6 4.6M4.8 19.2l4.2-.9L19 8.3a2 2 0 0 0-2.8-2.8l-10 10-.9 3.7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <button class="tiny-action" type="button" data-folder-action="move" th:aria-label="#{button.move_named(${folder.name})}" th:title="#{button.move}">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                  <button class="tiny-action danger" type="button" data-folder-action="delete" th:aria-label="#{button.delete_named(${folder.name})}" th:title="#{button.delete}">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V4.8h6V7m2 0-.8 12H7.8L7 7m3.5 3v5.5m3-5.5v5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </button>
                </div>
              </article>
            </div>
          </section>

          <div id="files-section" class="files-section" th:hidden="${files.isEmpty()}">
            <div class="section-heading file-section-heading">
              <h3 th:text="#{files.heading}"></h3>
              <span id="files-section-count" class="section-count" th:text="${#numbers.formatInteger(files.size(), 1, 'DEFAULT')}"></span>
            </div>
            <div class="table-scroll">
              <table class="file-table">
                <thead>
                  <tr>
                    <th scope="col" th:text="#{files.name}"></th>
                    <th scope="col" th:text="#{files.size}"></th>
                    <th scope="col" th:text="#{files.updated}"></th>
                    <th scope="col"><span class="sr-only" th:text="#{files.actions}"></span></th>
                  </tr>
                </thead>
                <tbody id="file-table-body">
                    <tr th:each="file : ${files}" th:attr="data-item-id=${file.id},data-item-name=${file.name}">
                      <td>
                        <div class="file-name-cell">
                          <span class="file-type-icon" th:with="name=${#strings.toLowerCase(file.name)}"
                                th:classappend="${#strings.endsWith(name, '.pdf') ? 'type-pdf' :
                                  (#strings.endsWith(name, '.png') or #strings.endsWith(name, '.jpg') or #strings.endsWith(name, '.jpeg')
                                    or #strings.endsWith(name, '.gif') or #strings.endsWith(name, '.webp') or #strings.endsWith(name, '.svg')
                                    ? 'type-image' :
                                  (#strings.endsWith(name, '.zip') or #strings.endsWith(name, '.rar') or #strings.endsWith(name, '.7z')
                                    or #strings.endsWith(name, '.tar') or #strings.endsWith(name, '.gz') ? 'type-archive' : ''))}" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M6 3.8h8l4 4v12.4H6V3.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 4v4h4M9 12h6M9 15.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                          </span>
                          <span class="file-name-copy"><strong th:title="${file.name}" th:text="${file.name}"></strong><span th:text="${file.mimeType}"></span></span>
                        </div>
                      </td>
                      <td th:with="size=${file.sizeBytes}" th:text="${size < 1024 ? #numbers.formatInteger(size, 1, 'DEFAULT') + ' B' :
                          (size < 1048576 ? #numbers.formatDecimal(size / 1024.0, 1, 1) + ' KB' :
                          #numbers.formatDecimal(size / 1048576.0, 1, 1) + ' MB')}"></td>
                      <td class="file-date" th:text="${#temporals.format(file.updatedAt, #messages.msg('format.file_date'))}"></td>
                      <td>
                        <div class="file-actions">
                          <a class="download-link" th:href="@{/api/files/{id}/download(id=${file.id})}">
                            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4.5v10m0 0 3.5-3.5M12 14.5l-3.5-3.5M5 17v2h14v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <span th:text="#{files.download}"></span>
                          </a>
                          <button class="tiny-action" type="button" data-file-action="rename" th:aria-label="#{button.rename_named(${file.name})}" th:title="#{button.rename}">
                            <svg viewBox="0 0 24 24" fill="none"><path d="m14.2 5.2 4.6 4.6M4.8 19.2l4.2-.9L19 8.3a2 2 0 0 0-2.8-2.8l-10 10-.9 3.7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                          </button>
                          <button class="tiny-action" type="button" data-file-action="move" th:aria-label="#{button.move_named(${file.name})}" th:title="#{button.move}">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                          </button>
                          <button class="tiny-action danger" type="button" data-file-action="delete" th:aria-label="#{button.delete_named(${file.name})}" th:title="#{button.delete}">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M9 7V4.8h6V7m2 0-.8 12H7.8L7 7m3.5 3v5.5m3-5.5v5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                          </button>
                        </div>
                      </td>
                    </tr>
                </tbody>
              </table>
            </div>
          </div>

          <div id="empty-state" class="empty-state" th:hidden="${itemCount != 0}">
            <div class="empty-illustration">
              <svg viewBox="0 0 88 72" fill="none" aria-hidden="true">
                <path d="M16 23.5h21l6.5 7H72a6 6 0 0 1 6 6v22a6 6 0 0 1-6 6H16a6 6 0 0 1-6-6v-29a6 6 0 0 1 6-6Z" fill="#EEF3FF" stroke="#BDD0FF" stroke-width="2"/>
                <path d="M26 48.5a12.5 12.5 0 0 1 23.7-5.3 10.2 10.2 0 1 1 11.8 14.8H27.2A9.2 9.2 0 0 1 26 48.5Z" fill="white" stroke="#97B2F5" stroke-width="2"/>
                <path d="m38 49 5-5 5 5m-5-5v12" stroke="#5279D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h3 th:text="${currentFolder == null} ? #{workspace.empty.root} : #{workspace.empty.folder}"></h3>
            <p th:text="#{workspace.empty.hint}"></p>
            <button class="button button-primary" type="button" data-empty-upload th:text="#{workspace.empty.upload}"></button>
          </div>

        </section>

        <div id="drop-overlay" class="drop-overlay" hidden>
          <div class="drop-overlay-card">
            <span class="drop-upload-icon">↑</span>
            <strong th:text="#{workspace.drop.title}"></strong>
            <span th:text="#{workspace.drop.hint}"></span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <dialog th:if="${currentUser != null}" id="action-dialog" class="action-dialog">
    <form id="action-form" class="dialog-form">
      <button id="dialog-close" class="icon-button dialog-close" type="button" th:aria-label="#{button.close}">×</button>
      <p class="eyebrow" id="dialog-eyebrow" th:text="#{workspace.section}"></p>
      <h2 id="dialog-title" th:text="#{folders.create}"></h2>
      <div id="dialog-fields" class="dialog-fields"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="button button-secondary" type="button" th:text="#{button.cancel}"></button>
        <button id="dialog-submit" class="button button-primary" type="submit" th:text="#{button.save}"></button>
      </div>
    </form>
  </dialog>
  <template th:if="${currentUser != null}" id="localized-messages">
    <span data-key="button.save" th:text="#{button.save}"></span>
    <span data-key="button.save_name" th:text="#{button.save_name}"></span>
    <span data-key="error.refresh" th:text="#{error.refresh}"></span>
    <span data-key="error.request_failed" th:text="#{error.request_failed}"></span>
    <span data-key="error.secure_session" th:text="#{error.secure_session}"></span>
    <span data-key="error.upload_file" th:text="#{error.upload_file}"></span>
    <span data-key="files.delete.confirm" th:text="#{files.delete.confirm}"></span>
    <span data-key="files.destination" th:text="#{files.destination}"></span>
    <span data-key="files.dialog.name" th:text="#{files.dialog.name}"></span>
    <span data-key="files.move" th:text="#{files.move}"></span>
    <span data-key="files.rename" th:text="#{files.rename}"></span>
    <span data-key="files.upload.too_large" th:text="#{files.upload.too_large}"></span>
    <span data-key="folders.create" th:text="#{folders.create}"></span>
    <span data-key="folders.create_inside" th:text="#{folders.create_inside}"></span>
    <span data-key="folders.create_title" th:text="#{folders.create_title}"></span>
    <span data-key="folders.delete.confirm" th:text="#{folders.delete.confirm}"></span>
    <span data-key="folders.delete.nonempty" th:text="#{folders.delete.nonempty}"></span>
    <span data-key="folders.dialog.example" th:text="#{folders.dialog.example}"></span>
    <span data-key="folders.dialog.name" th:text="#{folders.dialog.name}"></span>
    <span data-key="folders.move" th:text="#{folders.move}"></span>
    <span data-key="folders.parent" th:text="#{folders.parent}"></span>
    <span data-key="folders.rename" th:text="#{folders.rename}"></span>
    <span data-key="success.file_deleted" th:text="#{success.file_deleted}"></span>
    <span data-key="success.file_moved" th:text="#{success.file_moved}"></span>
    <span data-key="success.file_renamed" th:text="#{success.file_renamed}"></span>
    <span data-key="success.file_uploaded" th:text="#{success.file_uploaded}"></span>
    <span data-key="success.folder_created" th:text="#{success.folder_created}"></span>
    <span data-key="success.folder_deleted" th:text="#{success.folder_deleted}"></span>
    <span data-key="success.folder_moved" th:text="#{success.folder_moved}"></span>
    <span data-key="success.folder_renamed" th:text="#{success.folder_renamed}"></span>
    <span data-key="validation.file.required" th:text="#{validation.file.required}"></span>
    <span data-key="validation.folder.required" th:text="#{validation.folder.required}"></span>
    <span data-key="validation.name.length" th:text="#{validation.name.length}"></span>
    <span data-key="workspace.item.count" th:text="#{workspace.item.count}"></span>
    <span data-key="workspace.items.count" th:text="#{workspace.items.count}"></span>
    <span data-key="workspace.root_option" th:text="#{workspace.root_option}"></span>
    <span data-key="workspace.search.empty" th:text="#{workspace.search.empty}"></span>
    <span data-key="workspace.search.retry" th:text="#{workspace.search.retry}"></span>
  </template>
</body>
</html>
