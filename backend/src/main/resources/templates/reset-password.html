<!doctype html>
<html lang="pt-BR" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="#{auth.reset.title}"></title>
  <link rel="stylesheet" th:href="@{/assets/styles.css}">
  <script type="module" th:src="@{/assets/validation.js}"></script>
</head>
<body>
  <main class="auth-panel recovery-panel">
    <div class="auth-panel-inner">
      <div class="auth-heading">
        <h2 th:text="#{auth.reset.title}"></h2>
      </div>
      <div th:unless="${resetToken}">
        <p role="alert" th:text="#{auth.reset.invalid_link}"></p>
        <a class="recovery-link" th:href="@{/forgot-password}" th:text="#{auth.reset.request_again}"></a>
      </div>
      <form th:if="${resetToken}" class="auth-form" method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${resetToken}">
        <p class="field-hint field-hint-error" role="alert" th:each="error : ${formErrors}" th:text="${error}"></p>
        <label class="field-label" for="new-password" th:text="#{auth.reset.new_password}"></label>
        <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128"
               aria-describedby="password-requirements"
               th:data-validation-required="#{validation.password.required}"
               th:data-validation-length="#{validation.password.register_length}" required>
        <p id="password-requirements" class="field-hint" th:text="#{auth.register.password_hint}"></p>
        <label class="field-label" for="confirmation" th:text="#{auth.reset.confirm_password}"></label>
        <input id="confirmation" name="confirmation" type="password" autocomplete="new-password" maxlength="128"
               th:data-validation-required="#{auth.reset.confirm_required}"
               th:data-validation-length="#{validation.password.login_length}" required>
        <button class="button button-primary button-wide" type="submit" th:text="#{auth.reset.submit}"></button>
      </form>
      <a class="recovery-link" th:href="@{/login}" th:text="#{auth.reset.back}"></a>
    </div>
  </main>
</body>
</html>
